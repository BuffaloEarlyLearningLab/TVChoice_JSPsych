<!DOCTYPE html>
<html>
<head>
    <title>My experiment</title>
    <script src="jatos.js"></script>
    <script src="jspsych/dist/jspsych.js"></script>
    <script src="jspsych/dist/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/dist/plugin-html-button-response.js"></script>
    <script src="jspsych/dist/plugin-audio-keyboard-response.js"></script>
    <script src="jspsych/dist/plugin-preload.js"></script>
    <script src="jspsych/dist/plugin-instructions.js"></script>
    <script src="scripts/util.js"></script>
    <link href="jspsych/dist/jspsych.css" rel="stylesheet" type="text/css" />
    <link href="stylesheet/stylesheet.css" rel="stylesheet" type="text/css" />
    <style>
      #parent-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 12px 20px;
        background-color: transparent;
        border-top: transparent;
        text-align: center;
        font-size: 16px;
        color: #000000; 
        z-index: 9999;
      }
      .jspsych-content {
        padding-bottom: 20px;
      }
      .footer-prompt {
        bottom: 48px;
        background-color: transparent;
        border-top: 1px solid #ffffff;
      }
      .footer-base {
        bottom: 0;
        background-color: transparent;
        border-top: none;
      }
    </style>
</head>
<body>
</body>
<script>

    // Initialize global variables for left/right, to be assigned in jatos.onLoad
    var left, right;
    var jsPsych = initJsPsych({
        on_trial_start: () => {},
        on_finish: () => {
            console.log("Component 1 finishing. Final studySessionData:", jatos.studySessionData);
            jatos.submitResultData(jsPsych.data.get().json(), () => {
                console.log("Result data submitted, starting next component");
                jatos.startNextComponent();
            });
        }
    });
    timeline = [];
    
    // Screen 1: Welcome block
    var welcome_block = {
        type: jsPsychHtmlButtonResponse,
        stimulus: '<p>Start the experiment</p>',
        choices: ['Next'],
        record_data: false,
        on_load: function () {
            if (parseInt(jatos.studySessionData["order_teach"]) > 2) {
                jatos.endStudy(false, "Enter correct Teaching order value to proceed");
            }
            if (parseInt(jatos.studySessionData["order_test"]) > 2) {
                jatos.endStudy(false, "Enter correct Test order value to proceed");
            }
        },
    };
    timeline.push(welcome_block);
    
    jatos.onLoad(() => {
        console.log("=== COMPONENT 1: INFORMANT INTRO ===");
        console.log("Initial studySessionData:", jatos.studySessionData);
        
        // Get existing session data or create new object
        let session_data = jatos.studySessionData || {};
        
        // Set URL parameters
        session_data.id = jatos.urlQueryParameters.id || session_data.id;
        session_data.order_teach = jatos.urlQueryParameters.order_teach || session_data.order_teach;
        session_data.order_test = jatos.urlQueryParameters.order_test || session_data.order_test;
        
        console.log("Checking informantPosition:", session_data.informantPosition);
        
        // If informant position not stored yet, randomize it
        if (!session_data.informantPosition) {
            if (Math.random() < 0.5) {
                left = "adult";
                right = "child";
            } else {
                left = "child";
                right = "adult";
            }
            session_data.informantPosition = `${left}-${right}`;
            console.log("Created NEW informantPosition:", session_data.informantPosition);
        } else {
            [left, right] = session_data.informantPosition.split("-");
            console.log("Using EXISTING informantPosition:", session_data.informantPosition);
        }
        
        console.log("Session data to save:", session_data);
        console.log("left:", left, "right:", right);
        
        // Save to studySessionData
        jatos.setStudySessionData(session_data)
            .then(() => {
                console.log("SESSION DATA SAVED");
                console.log("Verified studySessionData:", jatos.studySessionData);
                
                // Add participant id to jsPsych data properties
                jsPsych.data.addProperties({ participant_id: session_data.id });
                
                // Define informat_html function
                const informat_html = (left, right, show_footer = false, footer_html = "") => `
                  <div class="jspsych-content">
                    <div id="choose-container" style="display:flex;gap:60px;justify-content:center;align-items:center">
                      <div style="text-align:center">
                        <img id="${left}_choice" src="assets/img/${left}_informant.png"
                             style="max-width:60%;cursor:not-allowed;opacity:1" />
                      </div>
                      <div style="text-align:center">
                        <img id="${right}_choice" src="assets/img/${right}_informant.png"
                             style="max-width:60%;cursor:not-allowed;opacity:1" />
                      </div>
                    </div>
                    ${show_footer ? footer_html : ""}
                  </div>
                `;
                
                // Screen 2: Informant

                var informat_main = {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: informat_html(left, right),
                    choices: "NO_KEYS",
                    on_load: function () {
                        Informant_intro_people(left, right)
                    },
                    data: { "informant_intro_display_order": "left_" + left + "_right_" + right },
                };
                timeline.push(informat_main);
                
                // Screen 3: Comprehension check

                const compCheckParams = {
                    "adult": 'assets/Experimenter voice recordings/informant_intro/exp_adult_compre_jb.wav',
                    "child": 'assets/Experimenter voice recordings/informant_intro/exp_child_compre_jb.wav',
                };
                
                let first, last;
                if (Math.random() < 0.5) {
                    first = "adult";
                    last = "child";
                } else {
                    last = "adult";
                    first = "child";
                }
                
                console.log("Comprehension check order:", first, "then", last);

                timeline.push({
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: informat_html(left, right, true, first == "adult" ? FOOTER_ADULT : FOOTER_CHILD),
                    choices: "[]",
                    on_load: function () { comp_check_load(compCheckParams[first]); },
                    data: { "comp_check_order": first + "_check" }
                });
                
                timeline.push({
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: informat_html(left, right, true, last === "adult" ? FOOTER_ADULT : FOOTER_CHILD),
                    choices: "[]",
                    footer_html: FOOTER_INFORMANT_TEST,
                    on_load: function () { comp_check_load(compCheckParams[last]); },
                    data: { "comp_check_order": last + "_check" }
                });
                
                // Start the experiment
                jsPsych.run(timeline);
            })
            .catch(err => {
                console.error("Failed to save session data:", err);
                document.body.innerHTML = "<h2>Error: Failed to save session data. Please contact the researcher.</h2>";
            });
    });
</script>
</html>
