<!DOCTYPE html>
<html>

<head>
    <title>My experiment</title>
    <script src="jatos.js"></script>
    <script src="jspsych/dist/jspsych.js"></script>
    <script src="jspsych/dist/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/dist/plugin-html-button-response.js"></script>
    <script src="jspsych/dist/plugin-audio-keyboard-response.js"></script>
    <script src="jspsych/dist/plugin-preload.js"></script>
    <script src="jspsych/dist/plugin-instructions.js"></script>
    <script src="scripts/util.js"></script>
    <link href="jspsych/dist/jspsych.css" rel="stylesheet" type="text/css" />
    <link href="stylesheet/stylesheet.css" rel="stylesheet" type="text/css" />
</head>

<body>
</body>
<script>

    // http://localhost:9000/publix/fsNGQhLj5FJ?order_teach=2&id=12&order_test=1

    var jsPsych = initJsPsych({
        //on_trial_start: jatos.addAbortButton,
        on_trial_start: function () {
            session_data = {
                "id": jatos.urlQueryParameters.id,
                "order_teach": jatos.urlQueryParameters.order_teach,
                "order_test": jatos.urlQueryParameters.order_test
            };
            jatos.setStudySessionData(session_data);
            jsPsych.data.addProperties({ "participant_id": jatos.studySessionData["id"] });
            //console.log("Study session data set to:", jatos.studySessionData);
        },
        on_finish: () => jatos.startNextComponent(jsPsych.data.get().json())
    });

    //console.log("ID retrieved from URL parameters: ", jatos.studySessionData["id"]);
    //var jsPsych = initJsPsych();
    // var should_start_experiment = true;
    // if (1 <= jatos.studySessionData["order_teach"] <= 2) {
    //     should_start_experiment = false;
    //     jatos.abortStudy("participant aborted by pressing abort button");
    // }


    timeline = []

    // Screen 1: Welcome block

    var welcome_block = {
        type: jsPsychHtmlButtonResponse,
        stimulus: '<p>Start the experiment</p>',
        choices: ['Next'],
        record_data: false,
        on_load: function () {

            if (parseInt(jatos.studySessionData["order_teach"]) > 2) {
                jatos.endStudy(false, "Enter correct Teaching order value to proceed");
            }
            if (parseInt(jatos.studySessionData["order_test"]) > 2) {
                jatos.endStudy(false, "Enter correct Test order value to proceed");
            }
        },
    };
    timeline.push(welcome_block);

    // screen 2: Informant

    if (Math.random() < 0.5) {
        left = "adult";
        right = "child";
    }
    else {
        right = "adult";
        left = "child";
    }

    const informat_html = (left, right) => `<div id="choose-container" style="display:flex;gap:60px;justify-content:center;align-items:center">
      <div style="text-align:center">
        <img id="${left}_choice" src="assets/img/${left}_informant.png"  style="max-width:60%;cursor:not-allowed;opacity:1" />
      </div>
      <div style="text-align:center">
        <img id="${right}_choice" src="assets/img/${right}_informant.png" style="max-width:60%;cursor:not-allowed;opacity:1" />
      </div>
    </div>`;

    var informat_main = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: informat_html(left, right),
        choices: "NO_KEYS",
        on_load: function () {
            Informant_intro_people(left, right)
        },
        data: { "informant_intro_display_order": "left_" + left + "_right_" + right },
    };
    timeline.push(informat_main);

    var informat_end = {
        type: jsPsychHtmlButtonResponse,
        stimulus: informat_html(left, right),
        choices: ['Next'],
        response_ends_trial: true,
        record_data: false,

    };
    timeline.push(informat_end);

    // Screen 3: Comprehension check


    const compCheckParams = {
        "adult": 'assets/Experimenter voice recordings/informant_intro/exp_adult_compre_jb.wav',
        "child": 'assets/Experimenter voice recordings/informant_intro/exp_child_compre_jb.wav',
    };
    if (Math.random() < 0.5) {
        first = "adult";
        last = "child";
    }
    else {
        last = "adult";
        first = "child";
    }
    // console.log(first, last);
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: informat_html(left, right),
        choices: "NO_KEYS",
        on_load: function () { comp_check_load(compCheckParams[first]); },
        data: { "comp_check_order": first + "_then_" + last }

    });

    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: informat_html(left, right),
        choices: "NO_KEYS",
        on_load: function () { comp_check_load(compCheckParams[last]); },
        data: { "comp_check_order": first + "_then_" + last }

    });

    //console.log('built timeline:', timeline);
    jatos.onLoad(() => {
        jsPsych.run(timeline);
    });
    //jsPsych.run(timeline);

</script>

</html>
