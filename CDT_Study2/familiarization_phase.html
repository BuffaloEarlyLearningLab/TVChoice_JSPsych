<!DOCTYPE html>
<html>
<head>
    <title>My experiment</title>
    <script src="jatos.js"></script>
    <script src="jspsych/dist/jspsych.js"></script>
    <script src="jspsych/dist/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/dist/plugin-html-button-response.js"></script>
    <script src="jspsych/dist/plugin-audio-keyboard-response.js"></script>
    <script src="jspsych/dist/plugin-preload.js"></script>
    <script src="jspsych/dist/plugin-instructions.js"></script>
    <script src="scripts/util.js"></script>
    <link href="jspsych/dist/jspsych.css" rel="stylesheet" type="text/css" />
    <link href="stylesheet/stylesheet.css" rel="stylesheet" type="text/css" />
    <style>
      #parent-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 12px 20px;
        background-color: transparent;
        border-top: transparent;
        text-align: center;
        font-size: 16px;
        color: #000000; 
        z-index: 9999;
      }
      .jspsych-content {
        padding-bottom: 20px;
      }
      .footer-prompt {
        bottom: 48px;
        background-color: #ffffff;
        border-top: 1px solid #ffffff;
      }
      .footer-base {
        bottom: 0;
        background-color: transparent;
        border-top: none;
      }
    </style>
</head>
<body>
</body>
<script>

    var jsPsych = initJsPsych({
        on_trial_start: function () {
            // Preserve existing session data instead of creating new object
            session_data = jatos.studySessionData || {};
            
            // Update only what's needed
            session_data.id = jatos.urlQueryParameters.id;
            session_data.order_teach = jatos.urlQueryParameters.order_teach;
            session_data.order_test = jatos.urlQueryParameters.order_test;
            // informantPosition is now preserved
            
            jatos.setStudySessionData(session_data);
            jsPsych.data.addProperties({ "participant_id": jatos.studySessionData["id"] });
        },
        on_finish: () => jatos.startNextComponent(jsPsych.data.get().json())
    });

    jatos.onLoad(() => {
        let timeline = [];
        
        // screen 2: Object positions
        let left, right;
        if (Math.random() < 0.5) {
            left = "toy";
            right = "tool";
        } else {
            left = "tool";
            right = "toy";
        }
        
        console.log("Object position:", "left=" + left, "right=" + right);
        
        const object_html = (left, right, show_footer = false, footer_html = "") => `
          <div class="jspsych-content">
            <div id="choose-container" style="display:flex;gap:200px;justify-content:center;align-items:center">
              <div style="text-align:center">
                <img id="${left}_choice" src="assets/img/${left}.png"
                     style="max-width:80%;cursor:not-allowed;opacity:1" />
              </div>
              <div style="text-align:center">
                <img id="${right}_choice" src="assets/img/${right}.png"
                     style="max-width:80%;cursor:not-allowed;opacity:1" />
              </div>
            </div>
            ${show_footer ? footer_html : ""}
          </div>
        `;
        
        var object_main = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: object_html(left, right),
            choices: "NO_KEYS",
            on_load: function () {
                object_intro()
            },
            data: { "object_intro_display_order": "left_" + left + "_right_" + right },
        };
        timeline.push(object_main);
        
        // Screen 3: Comprehension check
        const compCheckParams = {
            "toy": 'assets/Experimenter voice recordings/familiarization_phase/exp_toy_compre_jb.wav',
            "tool": 'assets/Experimenter voice recordings/familiarization_phase/exp_tool_compre_jb.wav',
        };
        
        let first, last;
        if (Math.random() < 0.5) {
            first = "toy";
            last = "tool";
        } else {
            first = "tool";
            last = "toy";
        }
        
        console.log("Object comprehension check order:", first, "then", last);
        
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: object_html(left, right, true, first === "toy" ? FOOTER_TOY_PROMPT : FOOTER_TOOL_PROMPT),
            choices: "NO_KEYS",
            on_load: function () { comp_check_load_object(compCheckParams[first]); },
            data: { "object_comp_check_order": first }
        });
        
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: object_html(left, right, true, last === "toy" ? FOOTER_TOY_PROMPT : FOOTER_TOOL_PROMPT),
            choices: "NO_KEYS",
            on_load: function () { comp_check_load_object(compCheckParams[last]); },
            data: { "object_comp_check_order": last }
        });
        
        jsPsych.run(timeline);
    }); 
</script>
</html>
